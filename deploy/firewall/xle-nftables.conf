#!/usr/sbin/nft -f
# XLe has one process egress (PLC Modbus) and one lab management ingress.
# The firewall VM decides cross-zone forwarding. This guest policy also
# prevents same-bridge SCADA management and XLe-to-SCADA application traffic.
flush ruleset
table inet xle_local {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    iif lo accept
    ip saddr 10.10.3.10 tcp dport 22 accept
    counter comment "xle input drops"
  }
  chain output {
    type filter hook output priority filter; policy accept;
    ip daddr 10.10.2.10 counter drop comment "no xle to scada traffic"
  }
}
