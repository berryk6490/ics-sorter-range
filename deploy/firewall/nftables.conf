#!/usr/sbin/nft -f
#
# /etc/nftables.conf on fw
#
# The 62443 conduit. fw routes between three zones and this decides what is
# allowed to cross. Deny by default: the forward chain policy is drop, so
# anything not named below does not pass.
#
# Two reachability cases, per the master plan. Case A is the flat conduit the
# range was built and baselined in; Case B restricts Level 3 to the supervisory
# endpoint and nothing else. Switch between them by commenting one block and
# uncommenting the other, then reloading. Keeping both in one file means the
# difference between them is a diff, which is the evidence.

flush ruleset

table inet filter {

  # Zone definitions, named so the rules read as intent rather than as octets.
  define LVL1     = 10.10.1.0/24
  define LVL2     = 10.10.2.0/24
  define LVL3     = 10.10.3.0/24
  define PLC      = 10.10.1.10
  define DRIVES   = 10.10.1.21-10.10.1.26
  define SCADA    = 10.10.2.10
  define XLE      = 10.10.2.20
  define ANALYST  = 10.10.3.10

  chain input {
    type filter hook input priority filter; policy drop;

    # fw's own traffic. It has no services worth reaching, but locking itself
    # out over the console is a bad afternoon.
    ct state established,related accept
    iif lo accept
    ip protocol icmp accept
    tcp dport 22 accept
    udp dport 123 accept
    counter comment "input drops"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # Connection tracking does the return path. Without this every allowed
    # flow would need a mirror rule and the ruleset would double for no gain.
    ct state established,related accept
    ct state invalid drop

    # ---- Southbound supervisory poll: Level 2 to Level 1 -----------------
    # scada polls the PLC's Modbus server and each of the six drive emulators.
    # This is the process data path and the range does not run without it.
    ip saddr $SCADA ip daddr $PLC    tcp dport 502 counter accept \
      comment "scada -> plc modbus"
    ip saddr $SCADA ip daddr $DRIVES tcp dport 502 counter accept \
      comment "scada -> drives modbus"
    # XLe initiates route and outcome Modbus writes. It has no scanner or VFD
    # conduit; ASX stays on XLe loopback.
    ip saddr $XLE ip daddr $PLC tcp dport 502 counter accept \
      comment "xle -> plc modbus"

    # ---- CASE A: flat conduit (baseline, currently active) ---------------
    # Level 3 reaches everything. This is what the range was built in and what
    # the Milestone 2 baseline was captured against. It is not a mistake in the
    # ruleset; it is the condition being measured.
    ip saddr $ANALYST ip daddr $LVL1 counter accept comment "CASE A: L3 -> L1"
    ip saddr $ANALYST ip daddr $LVL2 counter accept comment "CASE A: L3 -> L2"

    # ---- CASE B: segmented (comment out Case A above to use) -------------
    # Level 3 reaches the supervisory endpoint and nothing else. Modbus to
    # Level 1 is gone; the only way down is through whatever scada chooses to
    # relay. Uncomment these two and comment the two above.
    #
    # ip saddr $ANALYST ip daddr $SCADA tcp dport 4840 counter accept \
    #   comment "CASE B: L3 -> L2 OPC UA only"
    # ip saddr $ANALYST ip daddr $SCADA icmp type echo-request counter accept \
    #   comment "CASE B: ping, so unreachable is distinguishable from dropped"

    # ---- Everything else ------------------------------------------------
    # Counters on the drop path matter: an attempt that is blocked should be
    # visible as a number, not as silence. This is the Milestone 4 evidence
    # that segmentation did something.
    counter comment "forward drops"
    log prefix "nft-forward-drop: " limit rate 10/minute
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
